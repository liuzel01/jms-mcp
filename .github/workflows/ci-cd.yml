name: JMS MCP CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: jms-mcp-production
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  IMAGE_REPOSITORY: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_PROJECT }}/jms-mcp
  AWS_REGION: ${{ vars.DEPLOY_AWS_REGION }}
  EC2_INSTANCE_ID: ${{ vars.DEPLOY_EC2_INSTANCE_ID }}
  HARBOR_REGISTRY: ${{ vars.HARBOR_REGISTRY }}
  HARBOR_PULL_SECRET_ARN: ${{ vars.HARBOR_PULL_SECRET_ARN }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Run unit tests
        run: uv run python -m unittest discover -s tests -v

      - name: Validate deployment script
        run: bash -n scripts/deploy-image.sh

  build:
    name: Build and publish immutable image
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    outputs:
      image: ${{ steps.image.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release configuration
        run: |
          set -euo pipefail
          test -n "$HARBOR_REGISTRY" || { echo "HARBOR_REGISTRY is not configured" >&2; exit 1; }
          test -n "${{ vars.HARBOR_PROJECT }}" || { echo "HARBOR_PROJECT is not configured" >&2; exit 1; }
          [[ "$HARBOR_REGISTRY" =~ ^[A-Za-z0-9][A-Za-z0-9.:-]*$ ]] || {
            echo "HARBOR_REGISTRY contains unsupported characters" >&2
            exit 1
          }

      - name: Log in to Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_ROBOT_ACCOUNT }}
          password: ${{ secrets.HARBOR_ROBOT_ACCOUNT_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ env.IMAGE_REPOSITORY }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Record immutable image reference
        id: image
        run: echo "image=${IMAGE_REPOSITORY}" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy immutable image through SSM
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        run: |
          set -euo pipefail
          test -n "$AWS_REGION" || { echo "DEPLOY_AWS_REGION is not configured" >&2; exit 1; }
          test -n "$EC2_INSTANCE_ID" || { echo "DEPLOY_EC2_INSTANCE_ID is not configured" >&2; exit 1; }
          test -n "$HARBOR_REGISTRY" || { echo "HARBOR_REGISTRY is not configured" >&2; exit 1; }
          test -n "$HARBOR_PULL_SECRET_ARN" || { echo "HARBOR_PULL_SECRET_ARN is not configured" >&2; exit 1; }
          test -n "${{ needs.build.outputs.digest }}" || { echo "image digest is missing" >&2; exit 1; }

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.DEPLOY_AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy through SSM
        env:
          IMAGE: ${{ needs.build.outputs.image }}@${{ needs.build.outputs.digest }}
        run: |
          set -euo pipefail
          quote() { printf '%q' "$1"; }
          SCRIPT_B64=$(base64 --wrap=0 scripts/deploy-image.sh)
          COMPOSE_B64=$(base64 --wrap=0 deploy/compose.production.yaml)
          SSM_COMMAND=$(cat <<EOF
          set -euo pipefail
          install -d -m 0755 /opt/jms-mcp/scripts
          echo $(quote "$SCRIPT_B64") | base64 --decode > /opt/jms-mcp/scripts/deploy-image.sh
          echo $(quote "$COMPOSE_B64") | base64 --decode > /opt/jms-mcp/compose.production.yaml
          chmod 0755 /opt/jms-mcp/scripts/deploy-image.sh
          JMS_MCP_IMAGE=$(quote "$IMAGE") HARBOR_REGISTRY=$(quote "$HARBOR_REGISTRY") HARBOR_PULL_SECRET_ARN=$(quote "$HARBOR_PULL_SECRET_ARN") AWS_REGION=$(quote "$AWS_REGION") /opt/jms-mcp/scripts/deploy-image.sh
          EOF
          )
          jq -Rn --arg command "$SSM_COMMAND" '{commands: [$command]}' > "$RUNNER_TEMP/ssm-parameters.json"
          COMMAND_ID=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --instance-ids "$EC2_INSTANCE_ID" \
            --comment "jms-mcp deploy ${GITHUB_SHA}" \
            --parameters "file://$RUNNER_TEMP/ssm-parameters.json" \
            --query 'Command.CommandId' --output text)
          set +e
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID"
          WAIT_STATUS=$?
          set -e
          INVOCATION=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$EC2_INSTANCE_ID")
          echo "$INVOCATION" | jq '{Status, StatusDetails, ResponseCode, Output: .StandardOutputContent, Error: .StandardErrorContent}'
          STATUS=$(echo "$INVOCATION" | jq -r '.Status')
          if [[ "$WAIT_STATUS" -ne 0 || "$STATUS" != "Success" ]]; then
            echo "SSM deployment failed with status: $STATUS" >&2
            exit 1
          fi
